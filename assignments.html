<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Assignments - EduERP</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>

<div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <a href="faculty-dashboard.html" class="brand" id="brandLink">
                <div class="brand-icon"><i class="ri-graduation-cap-fill"></i></div>
                <span>EduERP</span>
            </a>
        </div>
        <nav class="sidebar-nav" id="sidebarNav">
            <!-- Dynamic Nav Links -->
        </nav>
        <div class="sidebar-footer">
            <a href="#" id="logoutBtn" class="nav-item" style="color: var(--danger-color);"><i class="ri-logout-box-line nav-icon"></i> Logout</a>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="main-wrapper">
        <!-- Topbar -->
        <header class="topbar">
            <div class="topbar-left">
                <button class="mobile-toggle" id="mobileToggle"><i class="ri-menu-line"></i></button>
                <h2 class="page-title">Course Assignments</h2>
            </div>
            <div class="topbar-right">
                <div style="position: relative;">
                    <button class="btn-icon" id="notifBellBtn" title="Notifications">
                        <i class="ri-notification-3-line" style="font-size: 1.25rem;"></i>
                        <span class="badge badge-danger" id="notifBadge" style="position: absolute; top: -4px; right: -4px; display: none;">0</span>
                    </button>
                    <div id="notifDropdown" class="card" style="position: absolute; right: 0; top: 45px; width: 320px; z-index: 100; display: none;">
                        <div class="card-header" style="padding: 0.75rem 1rem;">
                            <h4 style="font-size: 0.9rem; margin: 0;">Notifications</h4>
                            <a href="notifications.html" style="font-size: 0.75rem;">View All</a>
                        </div>
                        <div id="notifList"></div>
                    </div>
                </div>
                <div class="user-profile">
                    <div class="avatar" id="navUserAvatar">U</div>
                    <div class="user-info">
                        <span class="user-name" id="navUserName">User</span>
                        <span class="user-role" id="navUserRole">Role</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Content Area -->
        <main class="content-area">
            <!-- Filter Bar -->
            <div class="filter-bar">
                <div class="filter-group" style="flex: 2;">
                    <label class="form-label"><i class="ri-search-line"></i> Search Assignments</label>
                    <input type="text" id="searchAssignment" class="form-control" placeholder="Search by title, subject or description...">
                </div>
                <div class="filter-group">
                    <label class="form-label">Subject</label>
                    <select id="filterSubject" class="form-select select-subject">
                        <option value="">All Subjects</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="form-label">Department</label>
                    <select id="filterDept" class="form-select select-dept">
                        <option value="">All Departments</option>
                    </select>
                </div>
                <div id="facultyAddAssignBtnWrapper">
                    <button class="btn btn-primary" id="addAssignmentBtn"><i class="ri-add-line"></i> Create Assignment</button>
                </div>
            </div>

            <!-- Assignments Grid / Cards -->
            <div id="assignmentsList" class="stat-grid" style="grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));">
                <div class="text-center text-muted p-4" style="grid-column: 1 / -1;"><span class="loader"></span> Loading course assignments...</div>
            </div>
        </main>
    </div>
</div>

<!-- Modal Form for Create/Edit Assignment -->
<div class="modal-overlay" id="assignmentModal">
    <div class="modal" style="max-width: 600px;">
        <div class="modal-header">
            <h3 class="modal-title" id="assignModalTitle">Create Assignment</h3>
            <button class="modal-close" id="closeAssignModal">&times;</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="assignId">
            
            <div class="form-group">
                <label for="assignTitle" class="form-label">Assignment Title *</label>
                <input type="text" id="assignTitle" class="form-control" placeholder="e.g. BST Implementation & Analysis" required>
            </div>

            <div class="stat-grid" style="grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 0;">
                <div class="form-group">
                    <label for="assignSubject" class="form-label">Subject *</label>
                    <select id="assignSubject" class="form-select select-subject" required>
                        <option value="">Select Subject</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="assignMaxMarks" class="form-label">Maximum Marks *</label>
                    <input type="number" id="assignMaxMarks" class="form-control" value="10" min="1" max="100" required>
                </div>
            </div>

            <div class="stat-grid" style="grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 0;">
                <div class="form-group">
                    <label for="assignDept" class="form-label">Department *</label>
                    <select id="assignDept" class="form-select select-dept" required>
                        <option value="">Select Department</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="assignYear" class="form-label">Academic Year *</label>
                    <select id="assignYear" class="form-select select-year" required>
                        <option value="">Select Year</option>
                    </select>
                </div>
            </div>

            <div class="stat-grid" style="grid-template-columns: 1fr 1fr 1fr; gap: 1rem; margin-bottom: 0;">
                <div class="form-group">
                    <label for="assignSection" class="form-label">Section *</label>
                    <select id="assignSection" class="form-select select-section" required>
                        <option value="">Select Section</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="assignAssignedDate" class="form-label">Assigned Date *</label>
                    <input type="date" id="assignAssignedDate" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="assignDueDate" class="form-label">Due Date *</label>
                    <input type="date" id="assignDueDate" class="form-control" required>
                </div>
            </div>

            <div class="form-group">
                <label for="assignDesc" class="form-label">Assignment Instructions / Description</label>
                <textarea id="assignDesc" class="form-control" rows="3" placeholder="Provide detailed submission requirements..."></textarea>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" id="cancelAssignModal">Cancel</button>
            <button class="btn btn-primary" id="saveAssignBtn"><i class="ri-save-line"></i> Save Assignment</button>
        </div>
    </div>
</div>

<div id="toast-container" class="toast-container"></div>

<script type="module" src="js/assignments.js"></script>
</body>
</html>
