<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduERP – College Student Management System | Register</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>

<div class="auth-wrapper" style="padding: 2rem 1rem;">
    <div class="auth-card" style="max-width: 620px;">
        <div class="auth-header">
            <div class="auth-logo">
                <i class="ri-user-add-fill"></i>
            </div>
            <h1 class="auth-title">Create EduERP Account</h1>
            <p class="auth-subtitle">Join your college portal to manage academic records</p>
        </div>

        <form id="registerForm" onsubmit="event.preventDefault();">
            <div class="form-group">
                <label for="role" class="form-label">Select Account Role</label>
                <select id="role" class="form-select" required style="font-weight: 600; color: var(--primary-color);">
                    <option value="student">Student Role</option>
                    <option value="faculty">Faculty / Teacher Role</option>
                </select>
            </div>

            <div class="stat-grid" style="grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 0;">
                <div class="form-group">
                    <label for="name" class="form-label">Full Name *</label>
                    <input type="text" id="name" class="form-control" placeholder="e.g. Alex Johnson" required>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">College Email *</label>
                    <input type="email" id="email" class="form-control" placeholder="alex@college.edu" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password *</label>
                <div style="position: relative;">
                    <input type="password" id="password" class="form-control" placeholder="At least 6 characters" required minlength="6">
                    <button type="button" id="togglePassword" class="btn-icon" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); border: none;">
                        <i class="ri-eye-off-line"></i>
                    </button>
                </div>
            </div>

            <!-- Student specific fields section -->
            <div id="studentFieldsSection">
                <div class="stat-grid" style="grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 0;">
                    <div class="form-group">
                        <label for="rollNo" class="form-label">Roll Number</label>
                        <input type="text" id="rollNo" class="form-control" placeholder="e.g. CS2026-001">
                    </div>

                    <div class="form-group">
                        <label for="department" class="form-label">Department</label>
                        <select id="department" class="form-select select-dept">
                            <option value="">Loading departments...</option>
                        </select>
                    </div>
                </div>

                <div class="stat-grid" style="grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 0;">
                    <div class="form-group">
                        <label for="year" class="form-label">Academic Year</label>
                        <select id="year" class="form-select select-year">
                            <option value="">Loading years...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="section" class="form-label">Section</label>
                        <select id="section" class="form-select select-section">
                            <option value="">Loading sections...</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Faculty specific field -->
            <div id="facultyFieldsSection" class="d-none">
                <div class="form-group">
                    <label for="facultyDept" class="form-label">Faculty Department</label>
                    <select id="facultyDept" class="form-select select-dept">
                        <option value="">Loading departments...</option>
                    </select>
                </div>
            </div>

            <button id="registerBtn" class="btn btn-primary w-100 mt-2" style="padding: 0.75rem; font-size: 1rem;">
                <i class="ri-check-line"></i> Create Account
            </button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="index.html" style="font-weight: 600;">Sign In</a>
        </div>
    </div>
</div>

<div id="toast-container" class="toast-container"></div>

<script type="module" src="js/auth.js"></script>
</body>
</html>
