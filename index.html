<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduERP Login - Student Management System</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">
                <i class="ri-graduation-cap-fill"></i>
            </div>
            <h1 class="auth-title">Welcome to EduERP</h1>
            <p class="auth-subtitle">Log in to your account to continue</p>
        </div>

        <form id="loginForm" onsubmit="event.preventDefault();">
            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="name@college.edu" required>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <div style="position: relative;">
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                    <button type="button" id="togglePassword" class="btn-icon" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); border: none;">
                        <i class="ri-eye-off-line"></i>
                    </button>
                </div>
            </div>

            <button id="loginBtn" class="btn btn-primary w-100 mt-2" style="padding: 0.75rem; font-size: 1rem;">
                Sign In
            </button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="register.html">Create an Account</a>
        </div>
    </div>
</div>

<div id="toast-container" class="toast-container"></div>

<script>
    document.getElementById('togglePassword').addEventListener('click', function() {
        const pwd = document.getElementById('password');
        const icon = this.querySelector('i');
        if (pwd.type === 'password') {
            pwd.type = 'text';
            icon.className = 'ri-eye-line';
        } else {
            pwd.type = 'password';
            icon.className = 'ri-eye-off-line';
        }
    });
</script>
<script type="module" src="js/auth.js"></script>
</body>
</html>
