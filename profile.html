<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - EduERP</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>

<div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <a href="faculty-dashboard.html" class="brand" id="brandLink">
                <div class="brand-icon"><i class="ri-graduation-cap-fill"></i></div>
                <span>EduERP</span>
            </a>
        </div>
        <nav class="sidebar-nav" id="sidebarNav">
            <!-- Dynamic Navigation -->
        </nav>
        <div class="sidebar-footer">
            <a href="#" id="logoutBtn" class="nav-item" style="color: var(--danger-color);"><i class="ri-logout-box-line nav-icon"></i> Logout</a>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="main-wrapper">
        <!-- Topbar -->
        <header class="topbar">
            <div class="topbar-left">
                <button class="mobile-toggle" id="mobileToggle"><i class="ri-menu-line"></i></button>
                <h2 class="page-title">User Account Profile</h2>
            </div>
            <div class="topbar-right">
                <div style="position: relative;">
                    <button class="btn-icon" id="notifBellBtn" title="Notifications">
                        <i class="ri-notification-3-line" style="font-size: 1.25rem;"></i>
                        <span class="badge badge-danger" id="notifBadge" style="position: absolute; top: -4px; right: -4px; display: none;">0</span>
                    </button>
                    <div id="notifDropdown" class="card" style="position: absolute; right: 0; top: 45px; width: 320px; z-index: 100; display: none;">
                        <div class="card-header" style="padding: 0.75rem 1rem;">
                            <h4 style="font-size: 0.9rem; margin: 0;">Notifications</h4>
                            <a href="notifications.html" style="font-size: 0.75rem;">View All</a>
                        </div>
                        <div id="notifList"></div>
                    </div>
                </div>
                <div class="user-profile">
                    <div class="avatar" id="navUserAvatar">U</div>
                    <div class="user-info">
                        <span class="user-name" id="navUserName">User</span>
                        <span class="user-role" id="navUserRole">Role</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Content Area -->
        <main class="content-area">
            <div class="stat-grid" style="grid-template-columns: 300px 1fr; align-items: start;">
                <!-- Profile Avatar Card -->
                <div class="card">
                    <div class="card-body text-center p-4">
                        <div class="avatar" id="profileBigAvatar" style="width: 90px; height: 90px; font-size: 2.25rem; margin: 0 auto 1rem;">U</div>
                        <h3 id="profileNameDisplay" style="margin-bottom: 0.25rem;">User Name</h3>
                        <div class="badge badge-primary mb-3" id="profileRoleBadge">ROLE</div>
                        <div style="font-size: 0.875rem; color: var(--text-muted);" id="profileEmailDisplay">user@college.edu</div>
                    </div>
                </div>

                <!-- Editable Profile Form -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Edit Account Details</h3>
                    </div>
                    <div class="card-body">
                        <form id="profileForm" onsubmit="event.preventDefault();">
                            <div class="stat-grid" style="grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 0;">
                                <div class="form-group">
                                    <label for="profileName" class="form-label">Full Name *</label>
                                    <input type="text" id="profileName" class="form-control" required>
                                </div>
                                <div class="form-group">
                                    <label for="profileEmail" class="form-label">Email Address (Read Only)</label>
                                    <input type="email" id="profileEmail" class="form-control" readonly disabled style="background-color: var(--bg-color);">
                                </div>
                            </div>

                            <div class="stat-grid" style="grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 0;">
                                <div class="form-group">
                                    <label for="profilePhone" class="form-label">Phone Number</label>
                                    <input type="text" id="profilePhone" class="form-control" placeholder="+1 234 567 8900">
                                </div>
                                <div class="form-group" id="rollNoGroup">
                                    <label for="profileRollNo" class="form-label">Roll Number / Staff ID</label>
                                    <input type="text" id="profileRollNo" class="form-control">
                                </div>
                            </div>

                            <div class="stat-grid" style="grid-template-columns: 1fr 1fr 1fr; gap: 1rem; margin-bottom: 0;">
                                <div class="form-group">
                                    <label for="profileDept" class="form-label">Department</label>
                                    <select id="profileDept" class="form-select select-dept">
                                        <option value="">Select Department</option>
                                    </select>
                                </div>
                                <div class="form-group" id="yearGroup">
                                    <label for="profileYear" class="form-label">Academic Year</label>
                                    <select id="profileYear" class="form-select select-year">
                                        <option value="">Select Year</option>
                                    </select>
                                </div>
                                <div class="form-group" id="secGroup">
                                    <label for="profileSection" class="form-label">Section</label>
                                    <select id="profileSection" class="form-select select-section">
                                        <option value="">Select Section</option>
                                    </select>
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="profileAddress" class="form-label">Residential Address</label>
                                <textarea id="profileAddress" class="form-control" rows="3" placeholder="Full residential street address"></textarea>
                            </div>

                            <button id="saveProfileBtn" class="btn btn-primary" style="padding: 0.75rem 1.5rem;">
                                <i class="ri-save-line"></i> Update Profile Information
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div id="toast-container" class="toast-container"></div>

<script type="module" src="js/profile.js"></script>
</body>
</html>
